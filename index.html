<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="styles.css">
<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
</head>

<body>
    <div class="My-To-Do-List">
<h1>My To-Do List</h1>

<ul class="todo-list">
    <li class="task-box">
     
        <input type="checkbox" id="gym">
        <label for="gym">Go To The Gym</label>
        <ul class="sub-item">
            <li class="sub-class">
            <a class="sub-item-link" href="https://docs.google.com/document/d/1-hy4W4Jm4G7M1pEXyg-f9bM24Fz3_VJUOOeEUucpNoo/edit?tab=t.0" target="_blank">Store Hours</a>
            </li>
        </ul>
    </li>

    <li class="task-box">
        
        <input type="checkbox"          id="walk">
        <label for="walk">Walk My Dog</label>
          <ul class="sub-item">
            <li>
            <a class="sub-item-link" href="https://docs.google.com/document/d/1-hy4W4Jm4G7M1pEXyg-f9bM24Fz3_VJUOOeEUucpNoo/edit?tab=t.0" target="_blank">Dog Treats</a>
            </li>
        </ul>
    </li>

    <li class="task-box">
      
        <input type="checkbox" id="work">
        <label for="work">Go To Work</label>
          <ul class="sub-item">
            <li>
            <a class="sub-item-link" href="https://docs.google.com/document/d/1-hy4W4Jm4G7M1pEXyg-f9bM24Fz3_VJUOOeEUucpNoo/edit?tab=t.0" target="_blank">Google Maps</a>
            </li>
        </ul>
    </li>

    <li class="task-box">
        <input id="study" type="checkbox">
        <label for="study">Study Japanese</label>
          <ul class="sub-item">
            <li>
         <a class="sub-item-link" href="https://docs.google.com/document/d/1-hy4W4Jm4G7M1pEXyg-f9bM24Fz3_VJUOOeEUucpNoo/edit?tab=t.0" 
            target="_blank">Wanikani</a>
            </li>
        </ul>
    </li>
</ul>
</div>
</body>

</html>
